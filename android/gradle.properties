org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- Android SDK levels -------------------------------------------------------
# Read by android/app/build.gradle.kts (see the comment there). They live here
# rather than in local.properties so they are visible, versioned, and the same
# for a fresh clone or CI; local.properties can repeat any of them to override
# one machine (it is gitignored, and already holds flutter.sdk and sdk.dir).
#
# compileSdk 37 / minor 2 / extension 0 is platform android-37.2; NDK
# 30.0.16248370 and build-tools 37.0.0 are the matching toolchain.
flutter.compileSdk=37
flutter.compileSdkMinor=2
flutter.sdkExtension=0
flutter.minSdk=28
flutter.targetSdk=37
flutter.ndkVersion=30.0.16248370
flutter.buildToolsVersion=37.0.0

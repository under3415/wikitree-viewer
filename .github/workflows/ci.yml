name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyse, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned rather than "latest": a Flutter upgrade should be a commit
          # that also runs here, not a surprise in a pull request.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      # `flutter gen-l10n` writes lib/l10n/app_localizations*.dart, and those are
      # committed, so formatting is part of the gate rather than an afterthought.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyse
        run: flutter analyze

      # No network and no Firebase needed: the tests use fixtures and fakes.
      - name: Test
        run: flutter test --reporter expanded
